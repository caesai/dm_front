name: Deploy static content to Production Server

on:
  push:
    branches: ['main']

jobs:
  deploy:
      runs-on: ubuntu-latest
      steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_YANDEX_MAPS_API_KEY: ${{ secrets.VITE_YANDEX_MAPS_API_KEY }}
          VITE_YANDEX_MAPS_API_LANG: ${{ secrets.VITE_YANDEX_MAPS_API_LANG }}
          VITE_EGIFT_API_TOKEN: ${{ secrets.VITE_EGIFT_API_TOKEN }}
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts || true
      
      - name: Copy folder content recursively to remote using rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.HOST }}:/var/www/dist/

